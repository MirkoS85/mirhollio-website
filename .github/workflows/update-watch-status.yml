name: Update Apple Watch status

on:
  workflow_dispatch:
  schedule:
    - cron: "3-58/5 * * * *"

permissions:
  contents: write

concurrency:
  group: watch-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh watch status
        run: node scripts/update-watch-status.mjs

      - name: Commit watch status
        run: |
          if git diff --quiet -- data/watch-status.json; then
            echo "No watch status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watch-status.json
          git commit -m "Update Apple Watch status"
          git push
