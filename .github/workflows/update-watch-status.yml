name: Update Apple Watch status

# GitHub does not honour a */5 cron. Measured gaps between runs on this repo
# were 36, 85, 89, 101, 114 and 291 minutes, so the feed the watch reads was
# routinely three quarters of an hour stale. Do the five-minute cadence inside
# the job instead, and chain the runs with workflow_dispatch, which is not
# rate-limited the way schedules are. Even the hourly cron here has been
# delivered 2-5 hours apart, so it is only the bootstrap and the recovery path.
on:
  workflow_dispatch:
  schedule:
    - cron: "4 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: watch-status
  # Never cancel. The chain below hands off to a successor run, and
  # cancel-in-progress killed exactly those successors - the queued dispatch was
  # cancelled by the next scheduled run, so the chain broke and the feed sat
  # still until the cron happened to fire again. GitHub keeps at most one
  # pending run per group, so queued runs cannot pile up.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh every five minutes for the hour
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/publish-watch-status-loop.sh

      # Hand off rather than wait for the next cron. workflow_dispatch is
      # delivered reliably, so the chain sustains the five-minute cadence
      # around the clock instead of dying at the end of each window.
      - name: Hand off to the next run
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-watch-status.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}" \
            && echo "handed off to the next watch-status run"
