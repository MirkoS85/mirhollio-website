name: Update FTSO delegation snapshot

# No schedule any more. The five-minute publisher loop
# (scripts/publish-watch-status-loop.sh) refreshes this snapshot every third
# cycle, so this workflow only ever raced it for the push and lost - three
# failed runs in a day. Kept dispatchable by hand as a manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftso-delegation-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Without this the job inherits the six-hour default, so one unresponsive
    # upstream holds a runner for the afternoon.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh delegation snapshot
        run: node scripts/update-ftso-delegations.mjs

      - name: Commit snapshot
        run: |
          # `git add` exits 128 on a path that does not exist, and this step runs
          # under `bash -e`. data/delegator-candidates.json is only written when
          # the chain could be read, so naming it unconditionally turned "the
          # RPC was unreachable this run" into a failed workflow and an alert.
          # And `git diff` cannot see an untracked file at all, so the first run
          # that created it would have reported no changes: stage first, then
          # ask the index what actually changed.
          stage_snapshot() {
            local file staged=0
            for file in data/ftso-delegations.json data/delegator-candidates.json; do
              if [ -e "$file" ]; then
                git add -- "$file" || return 1
                staged=1
              fi
            done
            [ "$staged" = 1 ]
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! stage_snapshot; then
            echo "No delegation snapshot files were produced."
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "No delegation snapshot changes."
            exit 0
          fi
          git commit -m "Update FTSO delegation snapshot"
          # This is now only a backstop: the five-minute publisher loop refreshes
          # this snapshot every third cycle. It still has to push safely, and the
          # previous attempt did not - `git push` alone fails outright on the
          # detached HEAD actions/checkout leaves, and `git pull --rebase`
          # conflicts because both sides rewrite the same generated JSON, which
          # then killed the run on `|| exit 1`.
          #
          # The snapshot is regenerated from scratch, so a losing commit holds
          # nothing worth keeping: take the remote tip, rebuild on it, retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push lost the race on attempt $attempt; resyncing and rebuilding."
            # `|| true` matters: this step runs under `bash -e`, and
            # `git rebase --abort` exits 128 when no rebase is in
            # progress - which is the normal case - killing the step
            # on the first lost race.
            git rebase --abort >/dev/null 2>&1 || true
            rm -rf .git/rebase-merge .git/rebase-apply
            git fetch -q origin "${GITHUB_REF_NAME}" || exit 1
            git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD || exit 1
            git reset -q --hard FETCH_HEAD || exit 1
            node scripts/update-ftso-delegations.mjs || exit 1
            stage_snapshot || { echo "Nothing left to publish after resync."; exit 0; }
            if git diff --cached --quiet; then
              echo "Nothing left to publish after resync."
              exit 0
            fi
            git commit -q -m "Update FTSO delegation snapshot" || exit 1
            sleep $((attempt * 3))
          done
          echo "Push still failing after 5 attempts."
          exit 1
