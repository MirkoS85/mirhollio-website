name: Update network position

# No schedule any more - same reason as the delegation workflow: the publisher
# loop refreshes network position and the two Flare Systems Explorer snapshots
# every third cycle, offset from the delegation refresh. Kept dispatchable by
# hand as a manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: network-position
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh network position snapshot
        run: node scripts/update-network-position.mjs

      - name: Watchdog - redispatch stale watch-status feed
        run: |
          AGE=$(( $(date +%s) - $(date -d "$(python3 -c "import json;print(json.load(open('data/watch-status.json'))['generatedAt'])")" +%s) ))
          echo "watch-status age: ${AGE}s"
          if [ "$AGE" -gt 1800 ]; then
            curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-watch-status.yml/dispatches" \
              -d '{"ref":"main"}' && echo "re-dispatched update-watch-status"
          fi

      - name: Commit snapshot
        run: |
          if git diff --quiet -- data/network-position.json data/fse-entity.json data/fse-entity-ftso.json; then
            echo "No network position changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/network-position.json data/fse-entity.json data/fse-entity-ftso.json
          git commit -m "Update network position snapshot"
          # Now only a backstop: the five-minute publisher loop refreshes these
          # snapshots too. The push still has to be safe, and this one was not -
          # `git push` alone fails on the detached HEAD actions/checkout leaves,
          # and `git pull --rebase` conflicts because both sides rewrite the same
          # generated JSON, which then killed the run on `|| exit 1`.
          #
          # These files are regenerated from scratch, so a losing commit holds
          # nothing worth keeping: take the remote tip, rebuild on it, retry.
          FILES="data/network-position.json data/fse-entity.json data/fse-entity-ftso.json"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push lost the race on attempt $attempt; resyncing and rebuilding."
            # `|| true` matters: this step runs under `bash -e`, and
            # `git rebase --abort` exits 128 when no rebase is in
            # progress - which is the normal case - killing the step
            # on the first lost race.
            git rebase --abort >/dev/null 2>&1 || true
            rm -rf .git/rebase-merge .git/rebase-apply
            git fetch -q origin "${GITHUB_REF_NAME}" || exit 1
            git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD || exit 1
            git reset -q --hard FETCH_HEAD || exit 1
            node scripts/update-network-position.mjs || exit 1
            if git diff --quiet -- $FILES; then
              echo "Nothing left to publish after resync."
              exit 0
            fi
            git add $FILES
            git commit -q -m "Update network position snapshot" || exit 1
            sleep $((attempt * 3))
          done
          echo "Push still failing after 5 attempts."
          exit 1
